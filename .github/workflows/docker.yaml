on:
  workflow_call:
    outputs:
      docker_image_tags:
        description: "Docker image tags"
        value: ${{ jobs.merge-descriptors.outputs.docker_image_tags }}
      image_tag:
        description: "The sha- tag of this build, for example sha-15d77eb"
        value: ${{ jobs.merge-descriptors.outputs.image_tag }}

name: Publish Docker image

# The job definitions are copied with minimal changes from the Docker documentation: https://docs.docker.com/build/ci/github-actions/multi-platform/

jobs:
  docker-build-and-push:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to mint the GitHub OIDC token that Chainguard exchanges for
      # registry credentials below.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The runtime base comes from cgr.dev. Chainguard's p0-security-github
      # identity trusts GitHub OIDC tokens for any p0-security repo on a branch
      # ref and holds registry.pull, so no secret is involved. Pinned to the
      # v0.5.1 commit of setup-chainctl.
      - name: Authenticate to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28
        with:
          identity: 9362afcb63b06a475d6304dec63f2abe1ca1991d/6e77c645e2e43c4b
      - name: Log in to cgr.dev
        run: chainctl auth configure-docker
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: p0security/braekhus
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Build into the local daemon and start the result as client and as
      # server. An image that exits on start never reaches the push below. The
      # push rebuilds from the same cache, so nothing is built twice.
      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: p0security/braekhus:start-check
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
      - name: Start the image as client and server
        run: .github/scripts/start-image.sh p0security/braekhus:start-check ${{ matrix.platform }}
      - name: Build and push Docker image
        id: docker-build-and-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=p0security/braekhus,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.docker-build-and-push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # From each platform job in the matrix of jobs in docker-build-and-push, we get the tags (descriptors)
  # that were uploaded as artifacts and merge them into a single metadata json.
  # This job only needs to execute once after all platform builds are completed.
  merge-descriptors:
    name: Merge descriptors
    runs-on: ubuntu-latest
    needs: [docker-build-and-push]
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Name the commit tag
        id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Customers run latest, so only promote.yaml moves it, after the canary
      # passes.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: p0security/braekhus
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.sha }}
            type=raw,value=candidate,enable={{is_default_branch}}
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'p0security/braekhus@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect p0security/braekhus:${{ steps.tag.outputs.sha }}
    outputs:
      docker_image_tags: ${{ steps.meta.outputs.tags }}
      image_tag: ${{ steps.tag.outputs.sha }}
