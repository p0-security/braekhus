on:
  # Not pull_request: the Chainguard identity trusts only OIDC subjects of the
  # form repo:p0-security/<repo>:ref:<ref>, and a pull_request token's subject
  # is repo:p0-security/braekhus:pull_request. Main builds and starts the image
  # in docker.yaml.
  push:
    branches-ignore: [main]

name: Start check

permissions: {}

concurrency:
  group: start-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start-check:
    name: Start the image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Authenticate to Chainguard
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: 9362afcb63b06a475d6304dec63f2abe1ca1991d/6e77c645e2e43c4b
      - name: Log in to cgr.dev
        run: chainctl auth configure-docker
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: p0security/braekhus:start-check
          platforms: ${{ matrix.platform }}
      - name: Start the image as client and server
        run: .github/scripts/start-image.sh p0security/braekhus:start-check ${{ matrix.platform }}
